# Managed by @plainconceptsplatform/workflows. Source: loops/workflows/visual-evidence.yml. Update with `workflows update --force`; consumer edits may be overwritten.
name: "Visual evidence"

# Runs on the raw runner (not inside the awf sandbox) so it has access to
# Docker for SQL Server and a working headless Chromium for screenshot capture.
# Reads the capturePlan left by the agent in evidence.json (status: "blocked")
# and executes it: starts the full stack, captures screenshots, overwrites
# evidence.json with status: "passed", and posts a PR comment.

on:
  pull_request:
    branches:
      - "feature/**"
      - "fix/**"
      - "bugfix/**"
      - "bot/**"
      - "patch/**"
      - "hotfix/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-evidence-${{ github.head_ref }}
  cancel-in-progress: true

env:
  DB_PASSWORD: "YourStrong!Passw0rd"
  PNPM_VERSION: "10"

jobs:
  capture:
    name: Capture visual evidence
    runs-on: RunnerLandingZone
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Find evidence.json
        id: find-evidence
        run: |
          set -euo pipefail

          EVIDENCE=""
          # Check active changes first, then archived
          for dir in openspec/changes/*/evidence openspec/changes/archive/*/evidence; do
            if [ -f "${dir}/evidence.json" ]; then
              EVIDENCE="${dir}/evidence.json"
              break
            fi
          done

          if [ -z "$EVIDENCE" ]; then
            echo "No evidence.json found in any OpenSpec change directory. Skipping."
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "evidence_path=$EVIDENCE" >> "$GITHUB_OUTPUT"

          STATUS=$(jq -r .status "$EVIDENCE")
          if [ "$STATUS" != "blocked" ]; then
            echo "Evidence status is '$STATUS', not 'blocked' — nothing to do."
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_PLAN=$(jq 'has("capturePlan")' "$EVIDENCE")
          if [ "$HAS_PLAN" != "true" ]; then
            echo "Evidence is blocked but has no capturePlan. Skipping."
            echo "has_plan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found blocked evidence with capturePlan."
          echo "has_plan=true" >> "$GITHUB_OUTPUT"
          # Extract capture plan fields for downstream steps
          REQUIRE_API=$(jq -r '.capturePlan.requireApi // true' "$EVIDENCE")
          REQUIRE_LOGIN=$(jq -r '.capturePlan.requireLogin // false' "$EVIDENCE")
          echo "require_api=$REQUIRE_API" >> "$GITHUB_OUTPUT"
          echo "require_login=$REQUIRE_LOGIN" >> "$GITHUB_OUTPUT"

          # Write routes as newline-delimited paths for the capture loop
          jq -r '.capturePlan.routes[]?.path // empty' "$EVIDENCE" > /tmp/evidence-routes.txt
          # Write viewports as width,height,label lines
          jq -r '.capturePlan.viewports[]? | "\(.width),\(.height),\(.label)"' "$EVIDENCE" > /tmp/evidence-viewports.txt

      # ── Stack startup ──────────────────────────────────────────────────

      - name: Activate pnpm
        if: steps.find-evidence.outputs.has_plan == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f9d12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        if: steps.find-evidence.outputs.has_plan == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.find-evidence.outputs.has_plan == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start SQL Server
        if: steps.find-evidence.outputs.has_plan == 'true' && steps.find-evidence.outputs.require_api == 'true'
        run: |
          set -euo pipefail

          # Try docker compose first (projects that have it)
          if [ -f docker-compose.yml ]; then
            echo "Starting SQL Server via docker compose..."
            export DB_PASSWORD="${{ env.DB_PASSWORD }}"
            docker compose up -d --wait sqlserver 2>/dev/null || true
            docker compose up --no-deps init-db 2>/dev/null || true
          else
            echo "No docker-compose.yml found, skipping SQL Server startup."
          fi

      - name: Start the application stack
        if: steps.find-evidence.outputs.has_plan == 'true'
        run: |
          set -euo pipefail

          # Start the full stack in background
          nohup pnpm run dev > /tmp/app-dev.log 2>&1 &
          DEV_PID=$!

          # Poll for the dev server on common ports
          APP_URL=""
          for port in 3000 3001 5087 5173 5174 5175 5180; do
            for i in $(seq 1 90); do
              HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "http://127.0.0.1:${port}" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
                APP_URL="http://127.0.0.1:${port}"
                echo "App is ready at $APP_URL (HTTP $HTTP_CODE)"
                break 2
              fi
              sleep 2
            done
          done

          if [ -z "$APP_URL" ]; then
            echo "::error::App did not return HTTP 200 within the polling window"
            tail -50 /tmp/app-dev.log
            exit 1
          fi

          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "DEV_PID=$DEV_PID" >> "$GITHUB_ENV"

      # ── Screenshot capture ─────────────────────────────────────────────

      - name: Install playwright-cli
        if: steps.find-evidence.outputs.has_plan == 'true'
        run: |
          if command -v playwright-cli > /dev/null 2>&1; then
            echo "playwright-cli already installed"
            exit 0
          fi
          npm install -g @playwright/cli@latest
          playwright-cli install --browser chromium 2>/dev/null || true
          playwright-cli --version

      - name: Capture screenshots
        if: steps.find-evidence.outputs.has_plan == 'true'
        id: capture
        run: |
          set -euo pipefail

          EVIDENCE="${{ steps.find-evidence.outputs.evidence_path }}"
          DEST="$(dirname "$EVIDENCE")"
          mkdir -p "$DEST"

          # Read the first viewport for initial capture
          FIRST_VP=$(head -1 /tmp/evidence-viewports.txt)
          FIRST_WIDTH=$(echo "$FIRST_VP" | cut -d, -f1)
          FIRST_HEIGHT=$(echo "$FIRST_VP" | cut -d, -f2)
          FIRST_LABEL=$(echo "$FIRST_VP" | cut -d, -f3)

          # Open browser at the first viewport
          playwright-cli open "$APP_URL" --viewport="${FIRST_WIDTH:-1280},${FIRST_HEIGHT:-720}"
          sleep 3

          # Handle mock login if needed
          if [ "${{ steps.find-evidence.outputs.require_login }}" = "true" ]; then
            # Take a snapshot to check if we're on a login page
            playwright-cli snapshot > /tmp/login-snap.json 2>/dev/null || true
            # Look for mock user buttons and click the first one
            MOCK_REF=$(jq -r 'first(.refs // [] | .[] | select(.text // "" | test("mock|@plainconcepts|admin"; "i")) | .ref) // ""' /tmp/login-snap.json 2>/dev/null || echo "")
            if [ -n "$MOCK_REF" ]; then
              echo "Found mock login button, clicking..."
              playwright-cli click "$MOCK_REF"
              sleep 3
            fi
          fi

          # Capture screenshots for each route and viewport
          CAPTURE_INDEX=1
          ROUTES=$(cat /tmp/evidence-routes.txt)

          # If no routes in the plan, default to /
          if [ -z "$ROUTES" ]; then
            ROUTES="/"
          fi

          while IFS= read -r vp_line; do
            [ -z "$vp_line" ] && continue
            VP_WIDTH=$(echo "$vp_line" | cut -d, -f1)
            VP_HEIGHT=$(echo "$vp_line" | cut -d, -f2)
            VP_LABEL=$(echo "$vp_line" | cut -d, -f3)

            # Resize viewport
            # For the first viewport the browser is already open at the right size
            if [ "$CAPTURE_INDEX" -gt 1 ]; then
              playwright-cli close
              playwright-cli open "$APP_URL" --viewport="${VP_WIDTH},${VP_HEIGHT}"
              sleep 2
              # Re-login if needed
              if [ "${{ steps.find-evidence.outputs.require_login }}" = "true" ]; then
                playwright-cli snapshot > /tmp/login-snap2.json 2>/dev/null || true
                MOCK_REF2=$(jq -r 'first(.refs // [] | .[] | select(.text // "" | test("mock|@plainconcepts|admin"; "i")) | .ref) // ""' /tmp/login-snap2.json 2>/dev/null || echo "")
                if [ -n "$MOCK_REF2" ]; then
                  playwright-cli click "$MOCK_REF2"
                  sleep 3
                fi
              fi
            fi

            ROUTE_INDEX=0
            while IFS= read -r route; do
              [ -z "$route" ] && continue

              # Resolve dynamic segments: replace :id with "first" from API
              if echo "$route" | grep -q ':id'; then
                # Try to get the first ID from the API
                FIRST_ID=$(curl -sf "http://127.0.0.1:5087/api/v1/accounts" 2>/dev/null | jq -r '.[0].id // .items[0].id // .data[0].id // empty' 2>/dev/null || echo "")
                if [ -z "$FIRST_ID" ]; then
                  FIRST_ID=$(curl -sf "http://127.0.0.1:3000/api/v1/accounts" 2>/dev/null | jq -r '.[0].id // .items[0].id // .data[0].id // empty' 2>/dev/null || echo "")
                fi
                if [ -n "$FIRST_ID" ]; then
                  route=$(echo "$route" | sed "s/:id/$FIRST_ID/g")
                else
                  # Fallback: try quotes endpoint
                  FIRST_ID=$(curl -sf "http://127.0.0.1:5087/api/v1/quotes" 2>/dev/null | jq -r '.[0].id // .items[0].id // .data[0].id // empty' 2>/dev/null || echo "")
                  if [ -z "$FIRST_ID" ]; then
                    FIRST_ID=$(curl -sf "http://127.0.0.1:3000/api/v1/quotes" 2>/dev/null | jq -r '.[0].id // .items[0].id // .data[0].id // empty' 2>/dev/null || echo "")
                  fi
                  if [ -n "$FIRST_ID" ]; then
                    route=$(echo "$route" | sed "s/:id/$FIRST_ID/g")
                  else
                    echo "::warning::Could not resolve :id in route $route, skipping"
                    continue
                  fi
                fi
              fi

              # Navigate
              if [ "$ROUTE_INDEX" -gt 0 ]; then
                playwright-cli goto "$APP_URL$route"
                sleep 2
              fi

              # Determine filename
              SAFE_ROUTE=$(echo "$route" | tr '/' '_' | sed 's/^_//;s/_$//')
              FILENAME=$(printf '%02d-%s-%s.png' "$CAPTURE_INDEX" "$VP_LABEL" "${SAFE_ROUTE:-home}")
              FILEPATH="$DEST/$FILENAME"

              playwright-cli screenshot --filename="$FILEPATH"

              echo "Captured $FILENAME ($(wc -c < "$FILEPATH") bytes)"
              ROUTE_INDEX=$((ROUTE_INDEX + 1))
            done <<< "$ROUTES"

            CAPTURE_INDEX=$((CAPTURE_INDEX + 1))
          done < /tmp/evidence-viewports.txt

          playwright-cli close

          echo "capture_index=$CAPTURE_INDEX" >> "$GITHUB_OUTPUT"

      - name: Update evidence.json with passed status
        if: steps.find-evidence.outputs.has_plan == 'true' && steps.capture.outcome == 'success'
        run: |
          set -euo pipefail

          EVIDENCE="${{ steps.find-evidence.outputs.evidence_path }}"
          DEST="$(dirname "$EVIDENCE")"

          COMMIT_SHA=$(git rev-parse HEAD)
          RAW_BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/${COMMIT_SHA}"
          REL_DEST=$(echo "$DEST" | sed "s|^$(git rev-parse --show-toplevel)/||")

          # Build assets array and markdown
          ASSETS_JSON="[]"
          MD_LINES="## Evidence\n\nScreenshots captured by the Visual Evidence workflow:\n\n"

          IMG_INDEX=1
          for img in "$DEST"/*-desktop-*.png "$DEST"/*-mobile-*.png; do
            [ -f "$img" ] || continue
            FILENAME=$(basename "$img")
            REL_PATH="${REL_DEST}/${FILENAME}"
            ABS_URL="${RAW_BASE}/${REL_PATH}"
            BYTES=$(wc -c < "$img")

            CAPTION=$(jq -r ".capturePlan.routes[$((IMG_INDEX-1))].caption // \"Screenshot $IMG_INDEX\"" "$EVIDENCE" 2>/dev/null || echo "Screenshot $IMG_INDEX")

            ASSETS_JSON=$(echo "$ASSETS_JSON" | jq --arg path "$ABS_URL" --arg caption "$CAPTION" --argjson bytes "$BYTES" \
              '. + [{"type": "screenshot", "path": $path, "caption": $caption, "bytes": $bytes, "format": "png"}]')

            MD_LINES+="![${CAPTION}](${ABS_URL})\n\n"
            IMG_INDEX=$((IMG_INDEX + 1))
          done

          # Overwrite evidence.json
          CHANGE_ID=$(jq -r .changeId "$EVIDENCE")
          jq -n \
            --arg changeId "$CHANGE_ID" \
            --argjson assets "$ASSETS_JSON" \
            --arg prMarkdown "$MD_LINES" \
            '{
              version: 1,
              changeId: $changeId,
              required: true,
              status: "passed",
              assets: $assets,
              reason: "",
              prMarkdown: $prMarkdown
            }' > "$EVIDENCE"

          echo "Updated evidence.json with status: passed, assets: $(echo "$ASSETS_JSON" | jq 'length')"

      - name: Commit and push updated evidence
        if: steps.find-evidence.outputs.has_plan == 'true' && steps.capture.outcome == 'success'
        run: |
          set -euo pipefail

          EVIDENCE="${{ steps.find-evidence.outputs.evidence_path }}"
          git add "$EVIDENCE"

          # Also add any new screenshot files
          DEST="$(dirname "$EVIDENCE")"
          git add "$DEST/"*.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update visual evidence [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Post PR comment with evidence
        if: steps.find-evidence.outputs.has_plan == 'true' && steps.capture.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          EVIDENCE="${{ steps.find-evidence.outputs.evidence_path }}"
          PR_NUMBER=$(jq -r '.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "Could not determine PR number, skipping comment"
            exit 0
          fi

          PR_MARKDOWN=$(jq -r .prMarkdown "$EVIDENCE")

          # Post idempotent comment (check for existing one)
          EXISTING=$(gh pr view "$PR_NUMBER" --comments --json comments \
            --jq '.comments[] | select(.body | contains("<!-- visual-evidence -->")) | .id' 2>/dev/null | head -1 || echo "")

          BODY="<!-- visual-evidence -->\n${PR_MARKDOWN}"

          if [ -n "$EXISTING" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" \
              --method PATCH \
              --field body="$(echo -e "$BODY")" 2>/dev/null || true
          else
            gh pr comment "$PR_NUMBER" --body "$(echo -e "$BODY")" 2>/dev/null || true
          fi

      - name: Kill dev server
        if: always()
        run: |
          kill ${{ env.DEV_PID }} 2>/dev/null || true
          pkill -f "pnpm.*dev" 2>/dev/null || true
          pkill -f "next dev" 2>/dev/null || true
          pkill -f "dotnet watch" 2>/dev/null || true
          docker compose down 2>/dev/null || true
